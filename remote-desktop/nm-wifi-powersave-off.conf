# Wi-Fi power saving wrecks streaming latency. Measured on this hardware:
# power save on gave 90.5 ms average LAN round-trip with repeated stream stalls,
# off gave 13.1 ms with none.
#
# `iw dev ... set power_save off` does not persist; this does.
# Ethernet remains the better answer if a cable can be run.
[connection]
wifi.powersave = 2
