# Machine-local configuration
#
# Uncomment the features that are relevant to this machine, and
# replace all ellipses with the correct values

[vars]
hostname = "..."
# git_email = "..." # uncomment to change the default git email

## Add backups to this machine (configure the user of the Hetzner storage box)
# [features.backup]
# host = "..."
# user = "..."

## Make this machine a Sunshine remote desktop host, reachable over Tailscale only
## Streams a real GNOME desktop from boot with no login; the Sunshine ports are
## dropped on every interface except tailscale0.  Needs a reboot to take effect.
# [features.remote-desktop-server]
# user      = "..."            # autologin user; owns the captured session
# connector = "HDMI-A-1"       # DRM connector to force on
# mode      = "1920x1080@60"   # mode is supplied directly, no EDID involved

## Create a user on this machine that automatically connects to a given RDP host
## Can be used multiple times for multiple hosts/users
# [[features.rdp-client]]

## Pull backups from the Hetzner storage box and replicate them locally
## Can be used multiple times to replicate multiple backups
# [[features.replicate-backup]]
